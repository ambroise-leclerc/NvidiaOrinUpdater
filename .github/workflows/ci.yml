name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get install -y -qq zstd gnupg shellcheck
      - run: pip install pytest ruff pyyaml
      - run: ruff check .
      - run: pytest -v
      - run: shellcheck orin_updater/target/late-command.sh tests/e2e/docker_roundtrip.sh orin-updater

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/docker_roundtrip.sh
